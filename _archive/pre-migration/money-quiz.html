<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="theme-darkmode.css">
  <title>แบบทดสอบการเงินสุดท้าทาย – MoneySkillz</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary-color: #00A693;
      --secondary-color: #FFC107;
      --background-color: #f0f7f5;
      --text-color: #333;
      --light-text-color: #666;
      --card-bg: #ffffff;
      --shadow: rgba(0, 166, 147, 0.1);
      --correct-color: #4CAF50;
      --wrong-color: #f44336;
    }

    body {
      font-family: 'Kanit', 'Segoe UI', sans-serif;
      background-color: var(--background-color);
      margin: 0;
      color: var(--text-color);
      transition: background-color 0.3s;
    }
    
    .top-left-back-btn {
      position: fixed; top: 20px; left: 20px;
      width: 50px; height: 50px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--primary-color);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2em; font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 12px var(--shadow);
      z-index: 1001;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease-in-out;
    }
    .top-left-back-btn:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 1);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .quiz-header {
      background: linear-gradient(135deg, var(--primary-color), #00796B);
      color: white;
      padding: 60px 20px 30px;
      text-align: center;
      border-radius: 0 0 35px 35px;
      box-shadow: 0 10px 30px var(--shadow);
      margin-bottom: 30px;
    }
    .quiz-header h1 { font-size: 2.5em; margin: 0 0 10px; text-shadow: 1px 1px 5px rgba(0,0,0,0.2); }
    .quiz-header p { font-size: 1.2em; opacity: 0.9; margin: 0; }

    .set-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .set-btn {
      padding: 20px; border-radius: 15px;
      background: var(--card-bg);
      color: var(--primary-color);
      border: 2px solid var(--primary-color);
      font-size: 1.1rem; font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease-out;
      box-shadow: 0 5px 15px var(--shadow);
      display: flex; align-items: center; gap: 15px;
    }
    .set-btn .icon { font-size: 2em; }
    .set-btn:hover {
      transform: translateY(-5px);
      background: var(--primary-color);
      color: white;
      box-shadow: 0 8px 25px rgba(0, 166, 147, 0.25);
    }

    .quiz-box { 
      margin: 0 auto; max-width: 600px; 
      background: var(--card-bg);
      padding: 30px; border-radius: 20px;
      box-shadow: 0 10px 40px var(--shadow);
    }
    .question-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;}
    .progress-bar { flex: 1; margin: 0 15px; height: 12px; background: #e0f2f1; border-radius: 10px; overflow: hidden;}
    .progress { background: linear-gradient(90deg, var(--secondary-color), #FFB300); height: 100%; border-radius: 10px; transition: width 0.5s ease; }
    .question { font-size: 1.25rem; margin-bottom: 25px; color: var(--primary-darker, #00796B); font-weight: 600;}
    .choices { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px;}
    .choices li {
      background: #f8f9fa;
      margin-bottom: 0;
      padding: 15px 20px;
      border-radius: 12px;
      border: 2px solid #dee2e6;
      font-size: 1.05rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .choices li:hover { border-color: var(--secondary-color); background-color: #fffbeb; }
    .choices li.correct { border-color: var(--correct-color); background: #e8f5e9; font-weight: 600; color: var(--correct-color);}
    .choices li.wrong { border-color: var(--wrong-color); background: #ffebee; font-weight: 600; color: var(--wrong-color); animation: shake 0.5s;}
    @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);}}
    .choices li.disabled { pointer-events: none; opacity: 0.7; }

    .explain-block {
      margin-top: 20px; padding: 15px; border-radius: 12px; animation: fadeIn 0.5s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .explain-block.correct { background: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20;}
    .explain-block.wrong { background: #ffebee; border: 1px solid #ef9a9a; color: #b71c1c;}
    .explain-block b { display: block; margin-bottom: 5px; font-size: 1.1em;}

    .action-btn {
      margin: 30px auto 0; display: block;
      background: linear-gradient(135deg, var(--secondary-color), #FFB300);
      color: #333;
      padding: 15px 40px; border-radius: 50px;
      border: none; font-size: 1.1rem; cursor: pointer;
      font-weight: 700; transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
    }
    .action-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255, 193, 7, 0.4);}
    .action-btn:disabled { background: #e0e0e0; color: #9e9e9e; cursor: not-allowed; box-shadow: none;}

    .score-section { text-align: center; }
    .score-box { background: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px var(--shadow);}
    .pie-wrap { width: 250px; height: 250px; margin: 20px auto; }
    #scoreMsg { font-size: 1.3em; font-weight: 600; margin-top: 20px; }
    
    .button-group { display: flex; justify-content: center; gap: 15px; margin-top: 30px;}
  </style>
</head>

  <div class="container">
    <div id="start-section">
      <header class="quiz-header">
        <h1>แบบทดสอบการเงิน</h1>
        <p>เลือกชุดคำถามเพื่อทดสอบความรู้ของคุณ!</p>
      </header>

    <div id="quiz-section" style="display:none;">

        </div>
        <div class="question" id="question"></div>

        <div id="explain" style="display:none;"></div>

        <button class="action-btn" id="finishBtn" style="display:none;">ดูผลลัพธ์</button>
      </div>
    </div>

    <div id="score-section" style="display:none;">
       <div class="score-box">
        <h2>ผลคะแนน</h2>
        <div class="pie-wrap"><canvas id="pieChart"></canvas></div>
        <p style="font-size: 1.5em; font-weight: 500;">คุณทำได้ <strong id="score" style="font-size: 1.8em; color: var(--primary-color);"></strong>/<span id="total"></span> คะแนน</p>
        <div id="scoreMsg"></div>
        <div class="button-group">
            <button class="action-btn" onclick="showExplain()">ดูเฉลย</button>
            <button class="action-btn" onclick="window.location.reload()">เล่นชุดอื่น</button>
        </div>
      </div>
    </div>

    <div id="explain-section" style="display:none;">

        <h1>เฉลยและคำอธิบาย</h1>

      </header>
      <div id="explainList"></div>
      <button class="action-btn" onclick="window.location.reload()">กลับไปหน้าแรก</button>
    </div>
  </div>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
    import { getFirestore, doc, updateDoc, increment, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBjLBl1sEGgQLyng51rW25b434bJ0opVc4",
      authDomain: "myapplication-bd04c034.firebaseapp.com",
      projectId: "myapplication-bd04c034",
      storageBucket: "myapplication-bd04c034.appspot.com",
      messagingSenderId: "49782830313",
      appId: "1:49782830313:web:c81b5d86a937f22d296c78"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;

    // --- Authentication ---
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
      } else {
        // If not logged in, sign in anonymously to get a UID
        try {
          const userCredential = await signInAnonymously(auth);
          currentUser = userCredential.user;
        } catch (error) {
          console.error("Anonymous sign-in failed:", error);
        }
      }
    });

    /**
     * Awards coins to the current user.
     * @param {number} amount The number of coins to award.
     * @returns {Promise<boolean>} True if successful, false otherwise.
     */
    async function addCoins(amount) {
      if (!currentUser || amount <= 0) return false;
      const userRef = doc(db, 'users', currentUser.uid);
      try {
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
            // If user document doesn't exist, create it.
            // This is crucial for anonymous users who might not have a doc yet.
            await setDoc(userRef, { coins: amount }, { merge: true });
        } else {
            // Use increment for a safe, atomic update
            await updateDoc(userRef, {
                coins: increment(amount)
            });
        }
        console.log(`Awarded ${amount} coins to user ${currentUser.uid}`);
        return true;
      } catch (error) {
        console.error("Error adding coins:", error);
        return false;
      }
    }

        { q: "ดอกเบี้ยทบต้น (Compound Interest) ทำงานอย่างไร?", c: ["ดอกเบี้ยเท่ากันทุกปี", "ได้ดอกเบี้ยจากเงินต้นเท่านั้น", "ดอกเบี้ยที่ได้รับถูกนำไปรวมกับเงินต้นเพื่อคิดดอกเบี้ยในงวดถัดไป", "ยิ่งฝากนาน ดอกเบี้ยยิ่งลด"], a: 2, explain: "พลังของดอกเบี้ยทบต้นคือการที่ดอกเบี้ยที่เราได้รับกลับมาสร้างดอกเบี้ยต่อไปอีกทอดหนึ่ง ทำให้เงินเติบโตแบบก้าวกระโดดในระยะยาว", recommend: "ยิ่งเริ่มออมและลงทุนเร็วเท่าไหร่ ยิ่งได้ประโยชน์จากดอกเบี้ยทบต้นมากขึ้นเท่านั้น" },

        4: { name: "การออมและการลงทุน", icon: "💰", questions: [

        { q: "ข้อใดคือความเสี่ยงของการใช้ 'Mobile Banking'?", c: ["ความสะดวกสบาย", "การถูก Phishing หรือหลอกให้กรอกรหัสผ่าน", "การโอนเงินได้ตลอด 24 ชั่วโมง", "มีโปรโมชั่นเยอะ"], a: 1, explain: "มิจฉาชีพอาจสร้างหน้าเว็บหรือส่ง SMS ปลอมเพื่อหลอกเอารหัสผ่านของเราไปทำธุรกรรม", recommend: "ห้ามคลิกลิงก์ที่ไม่น่าเชื่อถือ และห้ามให้รหัสผ่านกับใครเด็ดขาด" },
        { q: "e-Wallet (กระเป๋าเงินอิเล็กทรอนิกส์) แตกต่างจากบัญชีธนาคารอย่างไร?", c: ["ใช้ซื้อของไม่ได้", "มักใช้สำหรับใช้จ่ายในวงเงินไม่สูงและสะดวกกว่า", "มีความปลอดภัยน้อยกว่า", "ไม่มีความแตกต่าง"], a: 1, explain: "e-Wallet เน้นความสะดวกในการใช้จ่ายประจำวัน โอนเงิน เติมเงิน ในขณะที่บัญชีธนาคารเหมาะกับการเก็บเงินก้อนใหญ่", recommend: "ใช้ e-Wallet สำหรับค่าใช้จ่ายเล็กๆ น้อยๆ และใช้บัญชีธนาคารสำหรับเงินออมหลัก" },
        { q: "QR Code Payment ทำงานอย่างไร?", c: ["ใช้คลื่นวิทยุ", "สแกนภาพเพื่อดึงข้อมูลบัญชีและจำนวนเงินสำหรับการโอน", "ใช้ลายนิ้วมือ", "ใช้เสียง"], a: 1, explain: "QR Code เป็นวิธีที่รวดเร็วและแม่นยำในการชำระเงิน โดยลดความผิดพลาดจากการพิมพ์เลขบัญชีเอง", recommend: "ก่อนยืนยันการโอนเงินด้วย QR Code ควรตรวจสอบชื่อบัญชีและจำนวนเงินให้ถูกต้องเสมอ" },
        { q: "Cybersecurity ในเรื่องการเงินหมายถึงอะไร?", c: ["การรักษาความปลอดภัยของข้อมูลและธุรกรรมออนไลน์", "การลงทุนในหุ้นเทคโนโลยี", "การใช้คอมพิวเตอร์เก่ง", "การสร้างไวรัสคอมพิวเตอร์"], a: 0, explain: "คือการป้องกันข้อมูลส่วนตัวและข้อมูลทางการเงินของเราจากการถูกโจรกรรมหรือนำไปใช้ในทางที่ผิด", recommend: "ตั้งรหัสผ่านที่คาดเดายาก, เปิดใช้งานการยืนยันตัวตนสองขั้นตอน (2FA) เพื่อเพิ่มความปลอดภัย" }
      ]}
    };

    let currentSet = [], currentQuestionIndex = 0, score = 0, userAnswers = [];
    
    document.addEventListener('DOMContentLoaded', () => {
        const setListContainer = document.querySelector('.set-list');
        if (setListContainer) {
            Object.keys(sets).forEach(setId => {
                const setInfo = sets[setId];
                const button = document.createElement('button');
                button.className = 'set-btn';
                button.innerHTML = `<span class="icon">${setInfo.icon}</span> <span>${setInfo.name}</span>`;
                button.onclick = () => startSet(setId);
                setListContainer.appendChild(button);
            });
        }
    });


    function startSet(setId) {
      currentSet = sets[setId].questions;
      currentQuestionIndex = 0;
      score = 0;
      userAnswers = [];
      document.getElementById('start-section').style.display = "none";
      document.getElementById('quiz-section').style.display = "block";
      displayQuestion();
    }

    function displayQuestion() {
      const q = currentSet[currentQuestionIndex];
      document.getElementById('qNo').textContent = currentQuestionIndex + 1;
      document.getElementById('qTotal').textContent = currentSet.length;
      document.getElementById('progress').style.width = ((currentQuestionIndex) / currentSet.length) * 100 + "%";
      document.getElementById('question').textContent = q.q;
      const choicesEl = document.getElementById('choices');
      choicesEl.innerHTML = '';
      document.getElementById('explain').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('finishBtn').style.display = 'none';
      
      q.c.forEach((choice, i) => {
        const li = document.createElement('li');
        li.textContent = choice;
        li.onclick = () => selectAnswer(i, li);
        choicesEl.appendChild(li);
      });
    }

    function selectAnswer(selectedIndex, selectedElement) {
      const q = currentSet[currentQuestionIndex];
      userAnswers[currentQuestionIndex] = selectedIndex;

      document.querySelectorAll('#choices li').forEach((el, i) => {
        el.classList.add('disabled');
        if (i === q.a) el.classList.add('correct');
        if (i === selectedIndex && i !== q.a) el.classList.add('wrong');
      });

      const explainEl = document.getElementById('explain');
      if (selectedIndex === q.a) {
        score++;
        explainEl.className = 'explain-block correct';
        explainEl.innerHTML = `<b>✔️ ถูกต้อง!</b><p>${q.explain}</p>`;
      } else {
        explainEl.className = 'explain-block wrong';
        explainEl.innerHTML = `<b>❌ ผิดนะ!</b><p>คำตอบที่ถูกคือ: "${q.c[q.a]}"</p><p>${q.explain}</p>`;
      }
      explainEl.style.display = 'block';
      
      if (currentQuestionIndex < currentSet.length - 1) {
        document.getElementById('nextBtn').style.display = 'block';
      } else {
        document.getElementById('finishBtn').style.display = 'block';
      }
    }

    document.getElementById('nextBtn').onclick = () => {
        currentQuestionIndex++;
        displayQuestion();
    };

    document.getElementById('finishBtn').onclick = showScore;

    async function showScore() {
      document.getElementById('quiz-section').style.display = 'none';
      document.getElementById('score-section').style.display = 'block';
      document.getElementById('score').textContent = score;
      document.getElementById('total').textContent = currentSet.length;
      
      const percent = (score / currentSet.length) * 100;
      const passThreshold = 60; // เกณฑ์การผ่านคือ 60%
      let msg = '';

      if (percent >= 80) {
        msg = "ยอดเยี่ยม! คุณคือสุดยอดนักการเงินรุ่นเยาว์! 🤩";
      } else if (percent >= passThreshold) {
        msg = "เก่งมาก! ความรู้ทางการเงินแน่นปึ้ก 😊";
      } else {
        msg = "พยายามได้ดีมาก! แต่ยังไม่ผ่านเกณฑ์ ลองทบทวนแล้วเล่นใหม่อีกครั้งนะ 👍";
      }

      // --- REVISED: Award Coins Conditionally ---
      if (percent >= passThreshold) {
          const finalScore = score * 10; // 1 correct = 10 points
          const coinsEarned = Math.floor(finalScore / 2); // 2 points = 1 coin
          if (coinsEarned > 0) {
              const success = await addCoins(coinsEarned);
              if (success) {
                  msg += `<br>คุณผ่านแล้ว! ได้รับ ${coinsEarned} 🪙 เหรียญ!`;
              }
          }
      } else {
          // No coins awarded
          msg += `<br>คุณยังไม่ได้รับเหรียญในรอบนี้`;
      }
      document.getElementById('scoreMsg').innerHTML = msg;
      // --- END REVISED ---


      const ctx = document.getElementById('pieChart').getContext('2d');
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['ตอบถูก', 'ตอบผิด'],
          datasets: [{ data: [score, currentSet.length-score], backgroundColor: [ 'rgba(76, 175, 80, 0.8)', 'rgba(244, 67, 54, 0.8)' ], borderColor: ['#fff'], borderWidth: 4 }]
        },
        options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { display: false } } }
      });
    }

    function showExplain() {
      document.getElementById('score-section').style.display = 'none';
      document.getElementById('explain-section').style.display = 'block';
      const listEl = document.getElementById('explainList');
      listEl.innerHTML = "";
      currentSet.forEach((q, idx) => {
        let blockClass = (userAnswers[idx] === q.a) ? "explain-block correct" : "explain-block wrong";
        
        let choiceHtml = q.c.map((c, i) => {
          let cl = '';
          if (i === q.a) cl = 'correct';
          if (i === userAnswers[idx] && i !== q.a) cl += ' wrong';
          return `<li class="${cl}" style="pointer-events:none;">${c}</li>`;
        }).join('');

        listEl.innerHTML += `
          <div class="${blockClass}" style="margin-bottom: 20px;">
            <div class="question"><b>ข้อที่ ${idx+1}:</b> ${q.q}</div>
            <ul class="choices">${choiceHtml}</ul>
            <div style="margin-top:10px;"><b>💡 คำแนะนำ:</b> ${q.recommend}</div>
          </div>
        `;
      });
    }

  </script>
  <script src="darkmode-toggle.js"></script>
</body>
