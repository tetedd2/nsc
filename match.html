<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>จับคู่การเงิน</title>
  <meta name="theme-color" content="#06140d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/owl.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="match-game-style.css">
    <link rel="stylesheet" href="theme-darkmode.css">
  <link rel="stylesheet" href="moneyskillz-ui.css">
  <link rel="stylesheet" href="game-neon.css">
</head>
<body>
    <div class="container">
        <a href="game.html" class="back-btn"><span class="arrow">&#8592;</span> กลับหน้าเมนู</a>
        <div class="game-header">
            <div class="game-title" id="gameTitle">จับคู่การเงิน</div>
            <div id="gameSubtitle" style="font-size:1.01em;color:#388e3c;margin-bottom:7px;">จับคู่คำกับความหมายให้ไว!</div>
        </div>
        <div class="level-info">
            <div class="level">Level: <span id="playerLevel">1</span></div>
            <div class="exp">EXP: <span id="playerExp">0</span>/<span id="expToNext">100</span></div>
        </div>
        <div class="exp-bar">
            <div class="exp-fill" id="expFill"></div>
        </div>
        <div class="score-row">
            <div class="score-item">คะแนน: <span id="score">0</span></div>
            <div class="score-item timer">เวลา: <span id="timer">0</span>s</div>
        </div>
        <div class="card-board" id="gameBoard"></div>
        <div class="result-box" id="resultBox"></div>
        <div style="text-align:center;">
            <button class="main-btn" onclick="startMatchGame()">เล่นใหม่</button>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- โหมดมืดอัตโนมัติ -->
    <script>
      (function () {
        if (localStorage.getItem('moneySkillzDarkMode') === 'true') {
          document.body.classList.add('dark-mode');
        }
      })();
    </script>

    <!-- Engine เดียวรองรับ 3 ระดับ: match.html?level=easy|medium|hard -->
    <script src="js/confetti.js"></script>
    <script type="module" src="js/match-game.js"></script>
    <script src="darkmode-toggle.js"></script>
</body>
</html>
