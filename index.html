<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>กำลังเข้าสู่ระบบ... | MoneySkillz</title>
  <meta name="theme-color" content="#1F8F4E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/owl.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* MoneySkillz Brand Colors - สามารถปรับได้ตาม CI */
      --primary-color: #1F8F4E; /* เขียวการเงิน */
      --secondary-color: #2BC46A; /* เขียวสด */
      --accent-color: #FFD600; /* สีเหลืองทอง */
      --background-gradient-start: #2BC46A; /* เขียวสด */
      --background-gradient-end: #0E4D2C;   /* เขียวป่าเข้ม */
      --text-color: #FFFFFF; /* แก้ไข: ทำให้แน่ใจว่าไม่มีอักขระแปลกปลอม */
      --shadow-color: rgba(0, 0, 0, 0.15);
    }

    body {
      background: linear-gradient(135deg, var(--background-gradient-start) 0%, var(--background-gradient-end) 100%) !important;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Kanit', sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .logo-wrapper {
      animation: float 2s ease-in-out infinite, pulse 1.5s infinite alternate; /* เพิ่ม pulse */
      margin-bottom: 40px; /* เพิ่มระยะห่าง */
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 30px; /* ขอบโค้งมนมากขึ้น */
      background: rgba(255, 255, 255, 0.9); /* พื้นหลังโลโก้โปร่งแสง */
      box-shadow: 0 15px 35px 0 var(--shadow-color); /* เงาเข้มขึ้น */
      padding: 10px; /* เพิ่ม padding รอบโลโก้ */
    }

    .logo-wrapper img {
      width: 220px; /* ขนาดใหญ่ขึ้นเล็กน้อย */
      height: 220px;
      object-fit: contain;
      border-radius: 20px; /* รัศมีขอบใน */
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 15px 35px 0 var(--shadow-color); }
      100% { transform: scale(1.03); box-shadow: 0 20px 45px 0 rgba(0, 0, 0, 0.25); }
    }

    .loading-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px; /* ระยะห่างระหว่างข้อความและ spinner */
      color: var(--text-color);
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .loading-text {
      font-size: 1.2rem; /* ปรับขนาดฟอนต์ให้เล็กลงมากสำหรับเดสก์ท็อป */
      font-weight: 600;
      letter-spacing: 2px;
      overflow: hidden;
      white-space: nowrap;
      border-right: .18em solid var(--accent-color); /* สี cursor */
      animation:
        typing 2s steps(18, end) infinite alternate, /* ปรับ steps และ duration */
        blink-caret .8s step-end infinite;
      max-width: 90vw;
      text-align: center;
      line-height: 1.2;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }
    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: var(--accent-color); }
    }

    /* Loading Spinner */
    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-top: 6px solid var(--accent-color);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .logo-wrapper img {
        width: 180px;
        height: 180px;
      }
      .loading-text {
        font-size: 1rem; /* ปรับขนาดฟอนต์ให้เล็กลงมากสำหรับแท็บเล็ต */
      }
      .spinner {
        width: 40px;
        height: 40px;
        border-width: 5px;
      }
    }

    @media (max-width: 480px) {
      .logo-wrapper {
        margin-bottom: 30px;
      }
      .logo-wrapper img {
        width: 150px;
        height: 150px;
      }
      .loading-text {
        font-size: 0.8rem; /* ปรับขนาดฟอนต์ให้เล็กลงมากสำหรับมือถือ */
        width: auto; /* Allow text to wrap if too long */
      }
      .spinner {
        width: 35px;
        height: 35px;
        border-width: 4px;
      }
    }
    /* ===== เหรียญลอยพื้นหลัง ===== */
    .coins { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .coins span { position: absolute; bottom: -50px; font-size: 1.7rem; opacity: 0; animation: rise linear infinite; filter: drop-shadow(0 2px 6px rgba(0,0,0,.2)); }
    @keyframes rise { 0% { transform: translateY(0) rotate(0); opacity: 0; } 12% { opacity: .85; } 88% { opacity: .5; } 100% { transform: translateY(-112vh) rotate(380deg); opacity: 0; } }
    /* ===== แสงเรืองหลังโลโก้ ===== */
    .logo-wrapper { position: relative; z-index: 1; }
    .logo-wrapper::before { content:""; position:absolute; inset:-28px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,.4), transparent 70%); z-index:-1; animation: glow 2s ease-in-out infinite alternate; }
    @keyframes glow { from { opacity:.35; transform:scale(.88);} to { opacity:.8; transform:scale(1.12);} }
    .app-name { color:#fff; font-size:2rem; font-weight:800; letter-spacing:.5px; margin: 20px 0 4px; text-shadow: 0 2px 14px rgba(0,0,0,.28); z-index:1; }
    .app-tag { color: rgba(255,255,255,.9); font-size: .95rem; margin-bottom: 20px; z-index:1; }
    /* ===== แถบโหลด ===== */
    .load-bar { width: 170px; height: 7px; background: rgba(255,255,255,.25); border-radius: 999px; overflow: hidden; }
    .load-bar i { display:block; height:100%; width:42%; background: linear-gradient(90deg,#FFE169,#FFC13B); border-radius:999px; animation: slide 1.3s ease-in-out infinite; }
    @keyframes slide { 0%{ margin-left:-42%;} 100%{ margin-left:100%;} }
    .container { position: relative; z-index: 1; }
    @media (prefers-reduced-motion: reduce){ .coins span, .logo-wrapper::before, .load-bar i { animation: none; } .coins { display:none; } }
  </style>
  <link rel="stylesheet" href="moneyskillz-ui.css">
</head>
<body>
  <div class="coins" aria-hidden="true">
    <span style="left:8%;  animation-duration:7s;   animation-delay:0s;">🪙</span>
    <span style="left:22%; animation-duration:9.5s; animation-delay:1.6s;">💰</span>
    <span style="left:40%; animation-duration:6.5s; animation-delay:.6s;">฿</span>
    <span style="left:58%; animation-duration:8.5s; animation-delay:2.2s;">🪙</span>
    <span style="left:74%; animation-duration:7.5s; animation-delay:1s;">💵</span>
    <span style="left:88%; animation-duration:10.5s; animation-delay:3s;">🪙</span>
    <span style="left:50%; animation-duration:11s;  animation-delay:4s;">💰</span>
  </div>
  <div class="container">
    <div class="logo-wrapper">
      <img src="516746497_673252655760176_3157736752216908947_n.png" alt="MoneySkillz Logo">
    </div>
    <div class="app-name">MoneySkillz</div>
    <div class="app-tag">ออมวันนี้ เก่งการเงินวันหน้า</div>
    <div class="loading-area">
      <div class="load-bar"><i></i></div>
      <div class="loading-text">กำลังเข้าสู่ระบบ...</div>
    </div>
  </div>

  <script>
    // โหลดเสร็จ redirect ใน 3 วินาที
    setTimeout(function(){
      window.location.href = 'login.html'; // เปลี่ยนตรงนี้ถ้าจะไปหน้าอื่น
    }, 3000);
  </script>
</body>
</html>
