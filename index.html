<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>กำลังเข้าสู่ระบบ... | MoneySkillz</title>
  <meta name="theme-color" content="#0E4D2C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/owl.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Kanit', sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      overflow: hidden; position: relative;
      background:
        radial-gradient(120% 90% at 50% 15%, #1F8F4E 0%, #0E4D2C 55%, #062C19 100%) !important;
    }
    /* อนุภาคประกายพื้นหลัง */
    .sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .sparkles i {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,.8); box-shadow: 0 0 8px rgba(255,255,255,.9);
      animation: twinkle 2.6s ease-in-out infinite;
    }
    @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.5);} 50% { opacity: .9; transform: scale(1);} }

    /* เหรียญลอยขึ้น */
    .coins { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .coins span { position: absolute; bottom: -50px; font-size: 1.6rem; opacity: 0; animation: rise linear infinite; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }
    @keyframes rise { 0% { transform: translateY(0) rotate(0); opacity: 0; } 12% { opacity: .8; } 85% { opacity: .5; } 100% { transform: translateY(-115vh) rotate(400deg); opacity: 0; } }

    /* ===== เวทีตรงกลาง ===== */
    .stage { position: relative; width: 220px; height: 220px; z-index: 2; display: grid; place-items: center; }

    /* วงแหวนคลื่นกระจาย */
    .ripple { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); animation: ripple 2.4s cubic-bezier(.2,.6,.3,1) infinite; }
    .ripple:nth-child(2) { animation-delay: .8s; }
    .ripple:nth-child(3) { animation-delay: 1.6s; }
    @keyframes ripple { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.9); opacity: 0; } }

    /* วงโคจรเหรียญเล็ก */
    .orbit { position: absolute; width: 190px; height: 190px; animation: spin 3.2s linear infinite; }
    .orbit.rev { width: 150px; height: 150px; animation-duration: 2.4s; animation-direction: reverse; }
    .orbit .dot {
      position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
      width: 20px; height: 20px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #FFE9A8, #F2B600 60%, #B9770A);
      box-shadow: 0 0 10px rgba(255,193,59,.9); display: grid; place-items: center;
      font-size: 11px; font-weight: 800; color: #7a5200;
    }
    .orbit.rev .dot { width: 14px; height: 14px; font-size: 8px; background: radial-gradient(circle at 35% 30%, #D6FFE6, #37C06A 60%, #0E4D2C); color: #063; box-shadow: 0 0 10px rgba(55,192,106,.9); }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

    /* เหรียญ ฿ หมุน 3 มิติ */
    .coin3d-wrap { width: 118px; height: 118px; perspective: 600px; animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
    .coin3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: flip 2.4s cubic-bezier(.45,.05,.55,.95) infinite; }
    @keyframes flip { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
    .coin3d .face {
      position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden;
      background: radial-gradient(circle at 36% 28%, #FFF0B8, #FFD152 42%, #F2B600 66%, #B9770A 100%);
      box-shadow: inset 0 0 0 7px rgba(255,255,255,.28), inset 0 -8px 16px rgba(120,80,0,.4), 0 14px 34px rgba(0,0,0,.4);
      display: grid; place-items: center;
    }
    .coin3d .face span { font-size: 3.6rem; font-weight: 800; color: #8a5c00; text-shadow: 0 2px 0 rgba(255,255,255,.45); }
    .coin3d .back { transform: rotateY(180deg); }
    /* ประกายวับบนเหรียญ */
    .coin3d .shine { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; backface-visibility: hidden; }
    .coin3d .shine::after { content: ""; position: absolute; top: -60%; left: -30%; width: 50%; height: 220%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform: rotate(18deg); animation: sweep 2.4s ease-in-out infinite; }
    @keyframes sweep { 0% { left: -40%; } 55%,100% { left: 130%; } }

    /* ===== ข้อความ ===== */
    .brand { margin-top: 30px; text-align: center; z-index: 2; }
    .brand h1 {
      font-size: 2.1rem; font-weight: 800; letter-spacing: .5px; position: relative;
      background: linear-gradient(90deg, #d8ffe9, #ffffff 40%, #FFE9A8 60%, #d8ffe9);
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: titleIn .8s cubic-bezier(.2,.8,.2,1) both, shimmer 3s linear infinite;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,.3));
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    @keyframes titleIn { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
    .brand p { color: rgba(255,255,255,.9); font-size: 1rem; margin-top: 4px; animation: titleIn .8s .2s cubic-bezier(.2,.8,.2,1) both; }

    /* ===== ตัวบอกสถานะโหลด: เหรียญเด้ง 3 เม็ด ===== */
    .loader { margin-top: 26px; display: flex; gap: 12px; z-index: 2; }
    .loader b {
      width: 16px; height: 16px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #FFE9A8, #F2B600 60%, #B9770A);
      box-shadow: 0 0 10px rgba(255,193,59,.7); animation: bounce 1.1s ease-in-out infinite;
    }
    .loader b:nth-child(2) { animation-delay: .18s; }
    .loader b:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce { 0%,100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(-14px); opacity: 1; } }
    .loading-text { color: rgba(255,255,255,.85); font-size: .95rem; margin-top: 16px; letter-spacing: 1px; z-index: 2; }
    .loading-text::after { content: ""; animation: dots 1.4s steps(4,end) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

    @media (prefers-reduced-motion: reduce) {
      .coin3d, .orbit, .ripple, .coins span, .sparkles i, .loader b, .coin3d-wrap, .brand h1, .coin3d .shine::after { animation: none !important; }
      .coins, .sparkles { display: none; }
      .coin3d .back { display: none; }
    }
  </style>
  <link rel="stylesheet" href="moneyskillz-ui.css">
</head>
<body>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>
  <div class="coins" aria-hidden="true">
    <span style="left:10%;  animation-duration:7s;    animation-delay:0s;">🪙</span>
    <span style="left:28%;  animation-duration:9.5s;  animation-delay:1.6s;">💰</span>
    <span style="left:46%;  animation-duration:6.5s;  animation-delay:.6s;">฿</span>
    <span style="left:66%;  animation-duration:8.5s;  animation-delay:2.2s;">🪙</span>
    <span style="left:84%;  animation-duration:7.5s;  animation-delay:1s;">💵</span>
    <span style="left:92%;  animation-duration:10.5s; animation-delay:3s;">🪙</span>
  </div>

  <div class="stage">
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="ripple"></div>
    <div class="orbit"><div class="dot">฿</div></div>
    <div class="orbit rev"><div class="dot">$</div></div>
    <div class="coin3d-wrap">
      <div class="coin3d">
        <div class="face"><span>฿</span></div>
        <div class="face back"><span>฿</span></div>
        <div class="shine"></div>
      </div>
    </div>
  </div>

  <div class="brand">
    <h1>MoneySkillz</h1>
    <p>ออมวันนี้ เก่งการเงินวันหน้า</p>
  </div>

  <div class="loader"><b></b><b></b><b></b></div>
  <div class="loading-text">กำลังเข้าสู่ระบบ</div>

  <script>
    // ประกายดาวแบบสุ่ม
    (function () {
      var wrap = document.getElementById('sparkles');
      if (!wrap || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      for (var i = 0; i < 26; i++) {
        var s = document.createElement('i');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 2.6).toFixed(2) + 's';
        s.style.opacity = 0;
        wrap.appendChild(s);
      }
    })();
    // โหลดเสร็จ redirect
    setTimeout(function () { window.location.href = 'login.html'; }, 3200);
  </script>
</body>
</html>
