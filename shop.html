<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛒 ร้านค้า - MoneySkillz</title>
  <meta name="theme-color" content="#1F8F4E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/owl.png">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="theme-darkmode.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Kanit', sans-serif; background: #EEF6F0; margin: 0; padding-bottom: 40px; }

    /* Hero header */
    .shop-hero {
      position: relative; text-align: center; color: #fff;
      background: linear-gradient(140deg, #0E4D2C, #1F8F4E);
      padding: 50px 20px 46px; border-radius: 0 0 30px 30px;
      box-shadow: 0 12px 30px rgba(14,77,44,.25); overflow: hidden;
    }
    .shop-hero::after { content:""; position:absolute; right:-30px; top:-30px; width:150px; height:150px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); }
    .shop-hero .back-btn {
      position: absolute; left: 16px; top: 16px; z-index: 3;
      background: rgba(255,255,255,.2); color: #fff; border: none;
      border-radius: 50%; width: 42px; height: 42px; font-size: 1.3em; cursor: pointer;
      backdrop-filter: blur(4px); display: grid; place-items: center;
    }
    .shop-hero .hero-icon { width: 58px; height: 58px; margin: 0 auto 8px; border-radius: 18px; display: grid; place-items: center; font-size: 1.9rem; background: rgba(255,255,255,.18); }
    .shop-hero h1 { margin: 0; font-size: 1.7rem; font-weight: 700; }
    .coin-balance {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3);
      padding: 8px 18px; border-radius: 999px; font-weight: 700; font-size: 1.1rem;
    }

    .container { max-width: 620px; margin: 22px auto 0; padding: 0 16px; background: transparent !important; box-shadow: none !important; }
    .shop-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 4px; }

    .shop-item {
      position: relative; background: #fff; border: 1px solid #E4EEE8; border-radius: 20px;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 6px 18px rgba(16,42,40,.07); padding: 20px 12px 16px;
      transition: transform .14s, box-shadow .14s;
    }
    @media (hover:hover){ .shop-item:hover { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(16,42,40,.13); } }
    .shop-item .item-icon {
      width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
      font-size: 2.2em; margin-bottom: 10px;
      background: linear-gradient(135deg, #E8F6EE, #D7EEDF);
    }
    .shop-item .item-name { font-size: 1em; font-weight: 700; text-align: center; margin: 2px 0 6px; line-height: 1.25; color: #0E4D2C; }
    .shop-item .item-price {
      font-size: .95em; font-weight: 700; color: #E6A200; margin-bottom: 12px;
      display: inline-flex; align-items: center; gap: 4px;
      background: #FFF6DD; padding: 3px 12px; border-radius: 999px;
    }
    .shop-item button {
      margin-top: auto; width: 100%;
      background: linear-gradient(135deg, #2BC46A, #1F8F4E); color: #fff; border: none;
      border-radius: 12px; padding: 9px 0; font-size: 1em; cursor: pointer; font-weight: 700;
      font-family: 'Kanit', sans-serif; box-shadow: 0 4px 12px rgba(31,143,78,.26);
      transition: transform .12s, filter .15s;
    }
    .shop-item button:active { transform: scale(.97); }
    @media (hover:hover){ .shop-item button:hover { filter: brightness(1.05); } }
    .shop-item.unlocked { border-color: #2BC46A; box-shadow: 0 0 0 2px rgba(43,196,106,.2), 0 6px 18px rgba(16,42,40,.07); }
    .shop-item.unlocked button { background: #cdd9d1; color: #567; box-shadow: none; cursor: default; }
    .shop-item.unlocked .item-icon { background: linear-gradient(135deg, #BDEFCE, #8fe0ab); }

    body.dark-mode { background: #0c1711; }
    body.dark-mode .shop-item { background: #15271d; border-color: #26402f; }
    body.dark-mode .shop-item .item-name { color: #bff0d2; }
    body.dark-mode .shop-item .item-icon { background: #10311f; }
  </style>
  <link rel="stylesheet" href="moneyskillz-ui.css">
</head>
<body>
  <header class="shop-hero">
    <button class="back-btn" onclick="window.location.href='dashboard.html'" aria-label="กลับ">←</button>
    <div class="hero-icon">🛒</div>
    <h1>ร้านค้าของรางวัล</h1>
    <div class="coin-balance">🪙 <span id="userCoins">0</span> เหรียญ</div>
  </header>

  <div class="container">
    <div class="shop-row" id="shopItemsRow"></div>
  </div>

  <!-- Firebase SDK & Shop Logic -->
  <script type="module">
    import { onAuthStateChanged, doc, updateDoc, getDoc, arrayUnion, onSnapshot, auth, db } from './js/firebase-init.js';

    // ----- config Firebase -----


    // ---- เพิ่มเหรียญใหม่ๆ ได้ตรงนี้ ----
    const shopItems = [
      { id: 'bank', name: 'เหรียญนักออม', price: 100, icon: '🏦' },
      { id: 'invest', name: 'เหรียญนักลงทุน', price: 120, icon: '💹' },
      { id: 'planner', name: 'เหรียญวางแผน', price: 110, icon: '📝' },
      { id: 'debt', name: 'เหรียญปลอดหนี้', price: 90, icon: '💸' },
      { id: 'income', name: 'เหรียญรายรับหลายทาง', price: 80, icon: '🌐' },
      { id: 'entrepreneur', name: 'เหรียญผู้ประกอบการ', price: 150, icon: '💡' },
      { id: 'dreamer', name: 'เหรียญนักฝัน', price: 70, icon: '💭' },
      { id: 'superstar', name: 'เหรียญดาวรุ่ง', price: 200, icon: '🌟' },
      { id: 'gold', name: 'เหรียญทองคำ', price: 300, icon: '🪙' }
    ];

    // ---- แสดงเหรียญทุกอัน (ซื้อเหรียญไหนก่อนก็ได้) ----
    function renderShop(user) {
      document.getElementById('userCoins').textContent = user.coins || 0;
      const inventory = user.inventory || [];
      const row = document.getElementById('shopItemsRow');
      row.innerHTML = '';

      shopItems.forEach(item => {
        const bought = inventory.includes(item.id);
        const el = document.createElement('div');
        el.className = 'shop-item ' + (bought ? 'unlocked' : 'locked');
        el.innerHTML = `
          <div class="item-icon">${item.icon}</div>
          <div class="item-name">${item.name}</div>
          <div class="item-price">${item.price} 🪙</div>
          <button ${bought ? 'disabled' : ''}>
            ${bought ? 'ซื้อแล้ว' : 'ซื้อ'}
          </button>
        `;
        el.querySelector('button').onclick = async () => {
          if (bought) return;
          if ((user.coins || 0) < item.price) {
            alert("เหรียญไม่พอ!");
            return;
          }
          const ok = confirm(`ซื้อ ${item.name} ในราคา ${item.price} เหรียญ?`);
          if (!ok) return;
          await buyItem(auth.currentUser.uid, item.id, item.price);
        };
        row.appendChild(el);
      });
    }

    // ---- ฟังก์ชันซื้อของ ----
    async function buyItem(uid, itemId, price) {
      const userRef = doc(db, 'users', uid);
      const userSnap = await getDoc(userRef);
      if (!userSnap.exists()) return alert('ไม่พบข้อมูลผู้ใช้');
      const user = userSnap.data();
      if ((user.coins || 0) < price) return alert('เหรียญไม่พอ');
      await updateDoc(userRef, {
        coins: (user.coins || 0) - price,
        inventory: arrayUnion(itemId)
      });
      alert('ซื้อสำเร็จ!');
    }

    // ---- โหลดข้อมูล user ----
    onAuthStateChanged(auth, user => {
      if (!user) {
        alert('กรุณาเข้าสู่ระบบ');
        window.location.href = 'login.html';
        return;
      }
      onSnapshot(doc(db, 'users', user.uid), snap => {
        const data = snap.data() || {};
        renderShop(data);
      });
    });
  </script>
  <script src="darkmode-toggle.js"></script>
</body>
</html>
