<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 กราฟการเงิน - MoneySkillz</title>
  <meta name="theme-color" content="#1F8F4E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/owl.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme-darkmode.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Kanit', sans-serif; background: #EEF6F0; min-height: 100vh; color: #12301F; overflow-x: hidden; padding-bottom: 120px; }

    /* ---- Hero header ---- */
    .header {
      background: linear-gradient(140deg, #0E4D2C, #1F8F4E);
      padding: 50px 20px 26px; text-align: center; position: relative;
      border-radius: 0 0 30px 30px; box-shadow: 0 12px 30px rgba(14,77,44,.28); overflow: hidden;
    }
    .header::after { content:""; position:absolute; right:-30px; top:-30px; width:160px; height:160px; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); }
    .back-btn {
      position: absolute; left: 16px; top: 16px; z-index: 3;
      background: rgba(255,255,255,.2); color: #fff; border: none; border-radius: 50%;
      width: 44px; height: 44px; cursor: pointer; font-size: 20px;
      display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);
    }
    .back-btn:active { transform: scale(.94); }
    .header .hero-icon { width: 56px; height: 56px; margin: 0 auto 6px; border-radius: 18px; display: grid; place-items: center; font-size: 1.8rem; background: rgba(255,255,255,.18); }
    .header h1 { color: #fff; font-size: 24px; font-weight: 700; margin-bottom: 2px; }
    .header p { color: rgba(255,255,255,.88); font-size: 15px; font-weight: 300; }
    .date-nav { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; }
    .date-nav button {
      background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 50%;
      width: 38px; height: 38px; cursor: pointer; font-size: 18px; display: grid; place-items: center;
    }
    .date-nav button:active { transform: scale(.9); }
    .date-nav span {
      color: #fff; font-size: 16px; font-weight: 600; min-width: 110px; text-align: center;
      background: rgba(255,255,255,.14); border-radius: 999px; padding: 6px 0;
    }

    /* ---- Stat cards ---- */
    .stats-overview { display: grid; grid-template-columns: repeat(3,1fr); margin: -28px 16px 22px; gap: 10px; position: relative; z-index: 4; }
    .stat-card {
      background: #fff; border-radius: 18px; padding: 16px 8px 14px; text-align: center;
      box-shadow: 0 8px 22px rgba(16,42,40,.1); border: 1px solid #E4EEE8;
    }
    .stat-card .icon {
      width: 40px; height: 40px; margin: 0 auto 8px; border-radius: 12px;
      display: grid; place-items: center; font-size: 20px; color: #fff; font-weight: 700;
    }
    .stat-card .label { font-size: 13px; color: #5B7A68; margin-bottom: 3px; }
    .stat-card .value { font-size: 15px; font-weight: 700; color: #12301F; }
    .icon.income { background: linear-gradient(135deg,#43D67E,#1F9D54); }
    .icon.expense { background: linear-gradient(135deg,#FF8A7D,#E2483B); }
    .icon.balance { background: linear-gradient(135deg,#5CB8FF,#2E86E0); }
    .value.income { color: #1F9D54; } .value.expense { color: #E2483B; }

    .container { padding: 4px 16px 20px; max-width: 520px; margin: 0 auto; }
    .chart-section { margin-bottom: 20px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
    .chart-title { color: #0E4D2C; font-size: 17px; font-weight: 700; }
    .chart-toggle { display: flex; background: #E4EEE8; border-radius: 999px; padding: 4px; }
    .chart-toggle button { background: transparent; color: #5B7A68; border: none; padding: 7px 15px; border-radius: 999px; cursor: pointer; font-family: 'Kanit',sans-serif; font-size: 13px; font-weight: 600; transition: all .2s; }
    .chart-toggle button.active { background: linear-gradient(135deg,#2BC46A,#1F8F4E); color: #fff; box-shadow: 0 3px 10px rgba(31,143,78,.3); }
    .chart-wrap { background: #fff; border-radius: 20px; padding: 20px 16px; box-shadow: 0 6px 18px rgba(16,42,40,.07); border: 1px solid #E4EEE8; }
    .chart-canvas { height: 280px !important; width: 100% !important; }
    .insights-section { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 6px 18px rgba(16,42,40,.07); border: 1px solid #E4EEE8; }
    .insights-title { font-size: 16px; font-weight: 700; color: #0E4D2C; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .insight-item { display: flex; align-items: center; gap: 13px; padding: 12px 0; border-bottom: 1px solid #EEF4F0; }
    .insight-item:last-child { border-bottom: none; }
    .insight-icon { width: 42px; height: 42px; flex: none; border-radius: 13px; display: grid; place-items: center; font-size: 18px; }
    .insight-text { flex: 1; font-size: 14px; color: #3C5648; line-height: 1.45; }
    .floating-actions { position: fixed; left: 16px; right: auto; bottom: calc(100px + env(safe-area-inset-bottom, 0)); display: flex; flex-direction: column; gap: 12px; z-index: 950; }
    .fab { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg,#2BC46A,#1F8F4E); color: #fff; border: none; cursor: pointer; font-size: 24px; display: grid; place-items: center; box-shadow: 0 6px 18px rgba(31,143,78,.38); transition: transform .14s; }
    .fab:active { transform: scale(.92); }

    /* Dark mode */
    body.dark-mode { background: #0c1711; color: #e8f5ee; }
    body.dark-mode .stat-card, body.dark-mode .chart-wrap, body.dark-mode .insights-section { background: #15271d; border-color: #26402f; }
    body.dark-mode .stat-card .value { color: #e8f5ee; }
    body.dark-mode .chart-title, body.dark-mode .insights-title { color: #bff0d2; }
    body.dark-mode .insight-text { color: #c7ead6; }
    body.dark-mode .chart-toggle { background: #10311f; }

    @media (max-width: 400px) { .stat-card .value { font-size: 13px; } .chart-canvas { height: 240px !important; } }
  </style>
  <link rel="stylesheet" href="moneyskillz-ui.css">
</head>
<body>
<div class="header">
  <button class="back-btn" onclick="location.href='dashboard.html'">←</button>
  <div class="hero-icon">📊</div>
  <h1>กราฟการเงิน</h1>
  <p>ดูภาพรวมการเงินของคุณ</p>
  <div class="date-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="currentMonth">...</span>
    <button onclick="changeMonth(1)">›</button>
  </div>
</div>
<div class="stats-overview">
  <div class="stat-card">
    <div class="icon income">↗</div>
    <div class="label">รายรับ</div>
    <div class="value" id="totalIncome">0</div>
  </div>
  <div class="stat-card">
    <div class="icon expense">↘</div>
    <div class="label">รายจ่าย</div>
    <div class="value" id="totalExpense">0</div>
  </div>
  <div class="stat-card">
    <div class="icon balance">💰</div>
    <div class="label">คงเหลือ</div>
    <div class="value" id="balance">0</div>
  </div>
</div>
<div class="container">
  <div class="chart-section">
    <div class="chart-header">
      <h3 class="chart-title">แนวโน้มการเงิน</h3>
      <div class="chart-toggle">
        <button class="active" onclick="toggleChart('line')">เส้นกราฟ</button>
        <button onclick="toggleChart('bar')">แท่งกราฟ</button>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="mainChart" class="chart-canvas"></canvas>
    </div>
  </div>
  <div class="chart-section">
    <div class="chart-header">
      <h3 class="chart-title">สัดส่วนรายรับ/รายจ่าย</h3>
      <div class="chart-toggle">
        <button class="active" onclick="togglePieChart('doughnut')">โดนัท</button>
        <button onclick="togglePieChart('pie')">พาย</button>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="pieChart" class="chart-canvas"></canvas>
    </div>
  </div>
  <div class="insights-section">
    <h3 class="insights-title">💡 ข้อมูลเชิงลึก</h3>
    <div id="insights-content">
      <!-- อัปเดตอัตโนมัติด้วย JS -->
    </div>
  </div>
</div>
<div class="floating-actions">
  <button class="fab" onclick="addTransaction()" title="เพิ่มรายการ">+</button>
  <button class="fab" style="background:#ffc107; color:#333;" onclick="addTestData()" title="เพิ่มข้อมูลตัวอย่าง">★</button>
</div>
<script type="module">
  import { auth, db, onAuthStateChanged, collection, query, orderBy, onSnapshot } from './js/firebase-init.js';

  let currentChart = null;
  let currentPieChart = null;
  let currentChartType = 'line';
  let currentPieType = 'doughnut';
  let allTransactions = [];

  const monthNames = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  let today = new Date();
  let selectedYear = today.getFullYear();
  let selectedMonth = today.getMonth();

  function updateMonthDisplay() {
    document.getElementById('currentMonth').textContent = `${monthNames[selectedMonth]} ${String(selectedYear + 543).slice(-2)}`;
  }

  onAuthStateChanged(auth, function(user) {
    if (user) {
      const uid = user.uid;
      onSnapshot(query(collection(db, "users", uid, "transactions"), orderBy("date")),
        (snapshot) => {
          allTransactions = [];
          snapshot.forEach(doc => {
            allTransactions.push({ id: doc.id, ...doc.data() });
          });
          updateMonthDisplay();
          updateStats();
          createMainChart();
          createPieChart();
          updateInsights();
        });
    } else {
      window.location.href = "login.html";
    }
  });

  function updateStats() {
    const monthKey = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`;
    let totalIncome = 0, totalExpense = 0;
    allTransactions.forEach(tx => {
      const amount = parseFloat(tx.amount);
      if (!isNaN(amount) && tx.date && tx.date.startsWith(monthKey)) {
        if (tx.type === 'income') totalIncome += amount;
        else if (tx.type === 'expense') totalExpense += amount;
      }
    });
    const balance = totalIncome - totalExpense;
    document.getElementById('totalIncome').textContent = totalIncome.toLocaleString() + ' ฿';
    document.getElementById('totalExpense').textContent = totalExpense.toLocaleString() + ' ฿';
    document.getElementById('balance').textContent = balance.toLocaleString() + ' ฿';
    const balanceEl = document.getElementById('balance');
    balanceEl.className = balance >= 0 ? 'value income' : 'value expense';
  }

  function getLastMonthsData(months) {
    const data = [];
    let baseYear = selectedYear;
    let baseMonth = selectedMonth;
    for (let i = months - 1; i >= 0; i--) {
      let d = new Date(baseYear, baseMonth - i, 1);
      let yearKey = d.getFullYear();
      let monthKey = String(d.getMonth() + 1).padStart(2, '0');
      let fullKey = `${yearKey}-${monthKey}`;
      const monthTx = allTransactions.filter(tx => tx.date && tx.date.startsWith(fullKey));
      const income = monthTx.filter(tx => tx.type === 'income').reduce((sum, tx) => sum + parseFloat(tx.amount), 0);
      const expense = monthTx.filter(tx => tx.type === 'expense').reduce((sum, tx) => sum + parseFloat(tx.amount), 0);
      data.push({ label: monthNames[d.getMonth()], income, expense });
    }
    return data;
  }

  function createMainChart() {
    const ctx = document.getElementById('mainChart').getContext('2d');
    if (currentChart) currentChart.destroy();
    const last6Months = getLastMonthsData(6);
    currentChart = new Chart(ctx, {
      type: currentChartType,
      data: {
        labels: last6Months.map(m => m.label),
        datasets: [
          {
            label: 'รายรับ',
            data: last6Months.map(m => m.income),
            borderColor: '#2BC46A',
            backgroundColor: currentChartType === 'bar' ? '#2BC46A' : 'rgba(43,196,106,0.12)',
            fill: currentChartType === 'line',
            tension: 0.4
          },
          {
            label: 'รายจ่าย',
            data: last6Months.map(m => m.expense),
            borderColor: '#FF6A5E',
            backgroundColor: currentChartType === 'bar' ? '#FF6A5E' : 'rgba(255,106,94,0.12)',
            fill: currentChartType === 'line',
            tension: 0.4
          },
          {
            label: 'เงินออม',
            data: last6Months.map(m => Math.max(0, m.income - m.expense)),
            borderColor: '#2196F3',
            backgroundColor: currentChartType === 'bar' ? '#2196F3' : 'rgba(33, 150, 243, 0.1)',
            fill: currentChartType === 'line',
            tension: 0.4
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'top', labels: { usePointStyle: true, padding: 20 } }
        },
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  // -------- PIE & DOUGHNUT CHART (รวมรับ/จ่าย) --------
  function getPieData() {
    const monthKey = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`;
    let incomeMap = {}, expenseMap = {};
    allTransactions.forEach(tx => {
      if (tx.date && tx.date.startsWith(monthKey)) {
        const label = tx.category || tx.name || 'ไม่ระบุ';
        if (tx.type === 'income') incomeMap[label] = (incomeMap[label] || 0) + parseFloat(tx.amount);
        if (tx.type === 'expense') expenseMap[label] = (expenseMap[label] || 0) + parseFloat(tx.amount);
      }
    });
    return { incomeMap, expenseMap };
  }

  function createPieChart() {
    const ctx = document.getElementById('pieChart').getContext('2d');
    if (currentPieChart) currentPieChart.destroy();

    const { incomeMap, expenseMap } = getPieData();
    let labels = [
      ...Object.keys(incomeMap).map(l => '[รับ] ' + l),
      ...Object.keys(expenseMap).map(l => '[จ่าย] ' + l)
    ];
    let data = [
      ...Object.values(incomeMap),
      ...Object.values(expenseMap)
    ];
    const incomeColors = ['#42a5f5', '#00bcd4', '#90caf9', '#1F8F4E', '#5c6bc0', '#80deea'];
    const expenseColors = ['#ef5350', '#ff9800', '#ab47bc', '#ff7043', '#ffa726', '#66bb6a'];
    let backgroundColor = [
      ...Object.keys(incomeMap).map((_, i) => incomeColors[i % incomeColors.length]),
      ...Object.keys(expenseMap).map((_, i) => expenseColors[i % expenseColors.length])
    ];

    currentPieChart = new Chart(ctx, {
      type: currentPieType, // ใช้ทั้ง pie/doughnut
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: backgroundColor,
          borderWidth: 2,
          borderColor: '#fff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { usePointStyle: true, padding: 15 } }
        }
      }
    });
  }
  // -------- END PIE & DOUGHNUT CHART --------

  function updateInsights() {
    const insightsDiv = document.getElementById('insights-content');
    const monthKey = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`;
    const lastMonthDate = new Date(selectedYear, selectedMonth - 1, 1);
    const lastMonthKey = `${lastMonthDate.getFullYear()}-${String(lastMonthDate.getMonth() + 1).padStart(2, '0')}`;
    
    // 1. รายรับเดือนนี้ vs เดือนที่แล้ว
    const sumIncome = (key) => allTransactions.filter(tx =>
      tx.type === 'income' && tx.date && tx.date.startsWith(key)
    ).reduce((sum, tx) => sum + parseFloat(tx.amount), 0);
    const incomeNow = sumIncome(monthKey);
    const incomeLast = sumIncome(lastMonthKey);
    let percentIncome = incomeLast === 0 ? 100 : Math.round(((incomeNow - incomeLast) / incomeLast) * 100);
    let text1 = (incomeLast === 0)
      ? 'เริ่มต้นมีรายรับในเดือนนี้'
      : `รายรับเดือนนี้เพิ่มขึ้น ${percentIncome >= 0 ? percentIncome : Math.abs(percentIncome)}% จากเดือนที่แล้ว`;
    if (percentIncome < 0) text1 = `รายรับเดือนนี้ลดลง ${Math.abs(percentIncome)}% จากเดือนที่แล้ว`;

    // 2. ค่าใช้จ่ายหมวด/ชื่อที่สูงสุด
    const expenses = allTransactions.filter(tx => tx.type === 'expense' && tx.date && tx.date.startsWith(monthKey));
    let byCategory = {};
    expenses.forEach(tx => {
      const key = tx.category || tx.name || 'อื่นๆ';
      byCategory[key] = (byCategory[key] || 0) + parseFloat(tx.amount);
    });
    let maxCat = Object.keys(byCategory).length ? Object.keys(byCategory).reduce((a, b) => byCategory[a] > byCategory[b] ? a : b) : '—';
    let percentCat = expenses.length ? Math.round((byCategory[maxCat] / expenses.reduce((s, tx) => s + parseFloat(tx.amount), 0)) * 100) : 0;
    let text2 = (maxCat !== '—')
      ? `ค่าใช้จ่ายหมวด${maxCat}สูงที่สุด คิดเป็น ${percentCat}% ของรายจ่ายทั้งหมด`
      : 'ยังไม่มีข้อมูลค่าใช้จ่ายในเดือนนี้';

    // 3. เงินออมเดือนนี้บรรลุเป้าหมาย XX%
    const targetSaving = 10000; // กำหนดเป้าหมายเงินออม ถ้ามีระบบ goal จริง set ตัวแปรนี้
    const savingNow = incomeNow - expenses.reduce((s, tx) => s + parseFloat(tx.amount), 0);
    let percentSaving = Math.max(0, Math.round((savingNow / targetSaving) * 100));
    if (percentSaving > 100) percentSaving = 100;
    let text3 = `เงินออมเดือนนี้บรรลุเป้าหมาย ${percentSaving}% แล้ว`;

    // html พร้อม icon
    insightsDiv.innerHTML = `
      <div class="insight-item">
        <div class="insight-icon" style="background: #e8f5e8; color: #2BC46A;">📈</div>
        <div class="insight-text">${text1}</div>
      </div>
      <div class="insight-item">
        <div class="insight-icon" style="background: #fff3e0; color: #ff9800;">💡</div>
        <div class="insight-text">${text2}</div>
      </div>
      <div class="insight-item">
        <div class="insight-icon" style="background: #e3f2fd; color: #2196F3;">🎯</div>
        <div class="insight-text">${text3}</div>
      </div>
    `;
  }

  function toggleChart(type) {
    currentChartType = type;
    document.querySelectorAll('.chart-section:nth-child(2) .chart-toggle button').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    createMainChart();
  }
  function togglePieChart(type) {
    currentPieType = type;
    document.querySelectorAll('.chart-section:nth-child(3) .chart-toggle button').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    createPieChart();
  }
  function changeMonth(direction) {
    selectedMonth += direction;
    if (selectedMonth > 11) {
      selectedMonth = 0;
      selectedYear++;
    } else if (selectedMonth < 0) {
      selectedMonth = 11;
      selectedYear--;
    }
    updateMonthDisplay();
    updateStats();
    createMainChart();
    createPieChart();
    updateInsights();
  }
  function exportData() {
    const dataStr = JSON.stringify(allTransactions, null, 2);
    const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
    const exportFileDefaultName = 'financial_data.json';
    const linkElement = document.createElement('a');
    linkElement.setAttribute('href', dataUri);
    linkElement.setAttribute('download', exportFileDefaultName);
    linkElement.click();
  }
  function addTransaction() {
    location.href = 'add-transaction.html';
  }
  function addTestData() {
    alert('ไม่รองรับการเพิ่มข้อมูลตัวอย่างในโหมดผู้ใช้จริง');
  }

  // module scope: expose ฟังก์ชันที่ inline onclick เรียกใช้ ให้เป็น global
  window.addTestData = addTestData;
  window.addTransaction = addTransaction;
  window.changeMonth = changeMonth;
  window.toggleChart = toggleChart;
  window.togglePieChart = togglePieChart;
</script>
<script src="darkmode-toggle.js"></script>
<script src="js/bottom-nav.js" defer></script>
<script type="module" src="js/nong-see-widget.js"></script>
</body>
</html>
