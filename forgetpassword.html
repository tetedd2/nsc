<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔒 ลืมรหัสผ่าน – MoneySkillz</title>
  <meta name="theme-color" content="#1F8F4E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/owl.png">
  <style>
    body {
      font-family: 'Kanit','Segoe UI','Leelawadee UI','Tahoma',sans-serif;
      background: linear-gradient(150deg, #0E4D2C 0%, #1F8F4E 58%, #2BC46A 100%) !important;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0; padding: 20px; box-sizing: border-box;
    }
    .reset-box {
      background: #fff;
      padding: 3.2rem 1.8rem 2rem;
      border-radius: 26px;
      box-shadow: 0 22px 54px rgba(8,40,24,.34);
      width: 100%;
      max-width: 400px;
      position: relative;
      text-align: center;
    }
    .avatar-login {
      width: 92px; height: 92px;
      border-radius: 50%;
      background: #fff url('assets/owl.png') center/80% no-repeat;
      box-shadow: 0 10px 24px rgba(14,77,44,.28);
      border: 4px solid #fff;
      position: absolute; left: 50%; top: -46px; transform: translateX(-50%);
    }
    .reset-box h1 {
      text-align: center;
      margin: 46px 0 8px;
      font-size: 1.7rem;
      color: #14673A;
      font-weight: 800;
    }
    .reset-box p {
      text-align: center;
      margin-bottom: 1.4rem;
      color: #5B7A68;
      font-size: .95rem;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      margin: 8px 0;
      border: 2px solid #E4EEE8;
      border-radius: 14px;
      font-size: 1.02rem;
      background: #F7FBF8;
      color: #12301F;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input::placeholder { color: #9db3a7; }
    input:focus { outline: 0; border-color: #1F8F4E; background: #fff; box-shadow: 0 0 0 4px rgba(31,143,78,.14); }
    button {
      width: 100%;
      background: linear-gradient(135deg, #1F8F4E, #2BC46A);
      color: #fff;
      padding: 14px;
      font-size: 1.05rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 6px 18px rgba(31,143,78,.3);
      transition: transform .12s, filter .15s;
    }
    button:active { transform: scale(0.98); filter: brightness(.96); }
    #message {
      margin-top: 12px;
      font-size: .92rem;
      text-align: center;
      min-height: 20px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
    }
    .back-link a {
      color: #1F8F4E;
      text-decoration: none;
      font-size: .98rem;
      font-weight: 600;
    }
    .back-link a:hover { text-decoration: underline; }
  </style>
  <link rel="stylesheet" href="moneyskillz-ui.css">
</head>
<body>

  <div class="reset-box">
    <div class="avatar-login"></div>
    <h1>ลืมรหัสผ่าน?</h1>
    <p>กรอกอีเมลของคุณ เพื่อรับลิงก์สำหรับรีเซ็ตรหัสผ่าน</p>

    <form id="resetForm">
      <input type="email" id="email" placeholder="อีเมลของคุณ" required>
      <button type="submit" id="resetBtn">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
    </form>

    <div id="message"></div>

    <div class="back-link">
      <a href="login.html">← กลับสู่หน้าเข้าสู่ระบบ</a>
    </div>
  </div>

  <!-- Firebase (รวมที่ js/firebase-init.js) -->
  <script type="module">
    import { auth, sendPasswordResetEmail } from './js/firebase-init.js';

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const messageDiv = document.getElementById('message');

      if (!email) {
        messageDiv.textContent = "กรุณากรอกอีเมลที่ถูกต้อง";
        messageDiv.style.color = "red";
        return;
      }

      messageDiv.textContent = "กำลังส่งลิงก์รีเซ็ตรหัสผ่าน...";
      messageDiv.style.color = "blue";

      try {
        await sendPasswordResetEmail(auth, email);
        messageDiv.textContent = "ลิงก์รีเซ็ตรหัสผ่านถูกส่งไปยังอีเมลของคุณแล้ว!";
        messageDiv.style.color = "green";
      } catch (error) {
        messageDiv.textContent = "เกิดข้อผิดพลาด: " + error.message;
        messageDiv.style.color = "red";
      }
    });
  </script>

</body>
</html>
