<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>สมัครสมาชิก – MoneySkillz</title>
  <meta name="theme-color" content="#1F8F4E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/owl.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Kanit','Segoe UI','Leelawadee UI','Tahoma',sans-serif;
      background: linear-gradient(150deg, #0E4D2C 0%, #1F8F4E 58%, #2BC46A 100%) !important;
      min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
      display: flex; justify-content: center; align-items: center;
    }
    .login-box {
      background: #fff;
      padding: 3.2rem 1.8rem 2rem;
      border-radius: 26px;
      box-shadow: 0 22px 54px rgba(8,40,24,.34);
      width: 360px; max-width: 100%;
      text-align: center;
      position: relative;
      overflow: visible;
    }
    .avatar-login {
      width: 92px; height: 92px;
      border-radius: 50%;
      background: #fff url('assets/owl.png') center/80% no-repeat;
      box-shadow: 0 10px 24px rgba(14,77,44,.28);
      border: 4px solid #fff;
      position: absolute; left: 50%; top: -46px; transform: translateX(-50%);
      z-index: 2;
    }
    .login-box h1 {
      margin: 46px 0 4px;
      font-size: 2rem;
      color: #14673A;
      font-weight: 800;
      letter-spacing: .3px;
    }
    .login-box p {
      margin: 0 0 18px;
      color: #5B7A68;
      font-size: .95rem;
    }
    .password-container { position: relative; width: 100%; }
    input {
      width: 100%; padding: 14px 16px;
      margin: 8px 0;
      border: 2px solid #E4EEE8;
      border-radius: 14px;
      font-size: 1.02rem;
      background: #F7FBF8;
      color: #12301F;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s, background .15s;
      box-sizing: border-box;
    }
    input::placeholder { color: #9db3a7; }
    input[type="password"], input[type="text"]#password { padding-right: 44px; }
    .toggle-password {
      position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
      cursor: pointer; font-size: 1.2rem; user-select: none;
    }
    input:focus { outline: 0; border-color: #1F8F4E; background: #fff; box-shadow: 0 0 0 4px rgba(31,143,78,.14); }
    button {
      width: 100%;
      background: linear-gradient(135deg, #1F8F4E, #2BC46A);
      color: #fff;
      padding: 14px;
      font-size: 1.05rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 12px;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 6px 18px rgba(31,143,78,.3);
      transition: transform .12s, filter .15s;
    }
    button:disabled { background: #cfe3d8; box-shadow: none; cursor: not-allowed; }
    button:active:not(:disabled) { transform: scale(0.97); filter: brightness(.96); }
    .divider { margin: 22px 0 14px; border-top: 1px solid #eef3f0; }
    .signup-link { margin-top: 11px; font-size: .95rem; color: #5B7A68; }
    .signup-link a { color: #1F8F4E; text-decoration: none; font-weight: 600; }
    #message {
      margin-top: 13px;
      font-size: 1rem;
      min-height: 23px;
      text-align: center;
    }
    @media (max-width: 470px) {
      .login-box { padding: 2.6rem 1.4rem 1.6rem; }
      .login-box h1 { font-size: 1.6rem; }
    }
  </style>
  <!-- Firebase รวมที่ js/firebase-init.js -->
  <link rel="stylesheet" href="moneyskillz-ui.css">
</head>
<body>
  <div class="login-box">
    <div class="avatar-login"></div>
    <h1>สมัครสมาชิก</h1>
    <p>สร้างบัญชี เริ่มออมเงินกันเลย</p>
    <form id="registerForm" autocomplete="on">
      <input type="text" id="username" placeholder="ชื่อผู้ใช้" required autocomplete="username"/>
      <input type="email" id="email" placeholder="อีเมล" required autocomplete="email"/>

      <div class="password-container">
        <input type="password" id="password" placeholder="รหัสผ่าน" required autocomplete="new-password"/>
        <span class="toggle-password">👁️</span>
      </div>

      <div class="password-container">
        <input type="password" id="confirmPassword" placeholder="ยืนยันรหัสผ่าน" required autocomplete="new-password"/>
        <span class="toggle-password">👁️</span>
      </div>

      <button type="submit">สมัครสมาชิก</button>
    </form>
    <div id="message"></div>
    <div class="divider"></div>
    <div class="signup-link">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></div>
  </div>
  <script type="module">
    import { auth, db, createUserWithEmailAndPassword, updateProfile, doc, setDoc, serverTimestamp } from './js/firebase-init.js';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = 'กำลังสมัครสมาชิก...';
      messageDiv.style.color = '#1F8F4E';

      // --- 1. ตรวจสอบรหัสผ่าน ---
      if (password !== confirmPassword) {
        messageDiv.textContent = 'รหัสผ่านไม่ตรงกัน';
        messageDiv.style.color = 'red';
        return;
      }

      if(password.length < 6){
        messageDiv.textContent = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
        messageDiv.style.color = 'red';
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        await updateProfile(user, { displayName: username });
        // --- ตั้งค่า User Document เริ่มต้นใน Firestore ให้ครบถ้วน ---
        await setDoc(doc(db, "users", user.uid), {
          displayName: username, // ใช้ displayName ที่ผู้ใช้กรอก
          email: email,
          createdAt: serverTimestamp(),
          level: 1, // ระดับเริ่มต้น
          xp: 0, // ค่า XP เริ่มต้น
          nextLevelXP: 100, // XP ที่ต้องใช้เพื่อขึ้น Level 2 (ตาม LEVEL_CONFIG ของ Level 1)
          quote: "เริ่มต้นเล็กๆ สร้างนิสัยยิ่งใหญ่!", // คำคมเริ่มต้นของ Level 1
          badges: [], // เหรียญตราที่ปลดล็อคแล้ว (เริ่มต้นไม่มี)
          coins: 0, // เหรียญสะสม (เริ่มต้นไม่มี)
          inventory: [], // ไอเทมที่ซื้อจากร้านค้า (เริ่มต้นไม่มี)
          lastLoginReward: '', // สำหรับระบบรางวัลรายวัน
          completedLessons: [] // *** สำคัญมาก: เพื่อรีเซ็ตสถานะบทเรียน ***
        });
        messageDiv.textContent = 'สมัครสมาชิกสำเร็จ! กำลังไปยังหน้าเข้าสู่ระบบ...';
        messageDiv.style.color = '#43cea2';
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1400);
      } catch (error) {
        messageDiv.textContent = 'เกิดข้อผิดพลาด: ' + error.message;
        messageDiv.style.color = 'red';
      }
    });

    // --- 2. โค้ดสำหรับปุ่มเปิด/ปิดรหัสผ่าน ---
    document.querySelectorAll('.toggle-password').forEach(toggle => {
        toggle.addEventListener('click', () => {
            const passwordInput = toggle.previousElementSibling;
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            // เปลี่ยนไอคอน (ถ้าต้องการ)
            toggle.textContent = type === 'password' ? '👁️' : '🙈';
        });
    });

  </script>
</body>
</html>
